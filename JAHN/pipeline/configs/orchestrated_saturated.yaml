# SATURATED MAIN LOOP — the frozen stage-1 chain + every ported handoff item (LEO PR #20) that
# fits the optimisation track, for the full-machine campaign:
#   abpipe orchestrate configs/orchestrated_saturated.yaml --rounds 12 --select 60 --out runs/sat-s11
#
#   item 1  s97_hedge generator: +1 CDRH3 novelty distance from every reference loop via the
#           never-varied S97; children inherit their parent's window scores
#   item 7  pin: [6] — Y105 stays fixed in scored_evolution's children and in the hedge's parents
#   item 2  nanomelt_tm scorer: predicted VH Tm as a tie-break (weights 0.25 vs 1.0 for the two
#           pre-filter columns); error ~4.1 degC and out-of-domain, never a gate
#   item 5  one fast validation path: validate-after-select (the official checkers on the shortlist)
#   item 4  the ledger gate: every run is check-run/add-run before launch, designs added after
run:
  name: orchestrated_saturated
  out_dir: runs
  seed: 11
data_dir: ${HOME}/hackathon-team-3/apheris/hackathon-data
repo_root: ${HOME}/hackathon-team-3
parent:
  table: her2-trastuzumab/trastuzumab_her2_spr_all_768.csv
  window_column: cdrh3
  id: trastuzumab

orchestrate:
  policy: rules
  patience: 3
  primary: score__pred_log10_kd

generators:
  - name: scored_evolution
    n: 20000
    params:
      min_subs: 4
      max_subs: 8
      pin: [6]                                  # Y105 fixed (largest buried surface; standing instruction)
      parents: bootstrap/parents_combined.csv   # LEO's JapanFold-RFD4 final 233 lead, then NICCOLO's 1M batch 1
      parents_sha256: 1a2a9950c6888e19
      history: [bootstrap/history.csv, bootstrap/candidates_1m_batch00001.csv, bootstrap/leo_jf_final.csv]
      history_sha256: 7a1d29aefb0b029b
  - name: s97_hedge
    n: 40
    params:
      residues: AWY                              # S97A (LEO's own leads), S97W, S97Y
      pin: [6]                                  # only hedge parents that keep Y105
      parents: shortlist/final_shortlist.csv   # window-only designs; later rounds feed themselves
      parents_sha256: b18a2898f0062e12

filters:
  - {name: framework_integrity}
  - {name: window_novelty, params: {min_dist: 3}}
  - {name: prefilter_gate, params: {min_p_binder: 0.8}}
  - {name: abguard_hard}
  - {name: dedupe}
  - {name: new_liabilities, params: {severities: [high], max_new: 0}}

validate:
  name: track_check

scorers:                          # the ORIGINAL frozen stage-1 scorer; NanoMelt parked until its
  - {name: niccolo_prefilter}      # -align path is verified (its no-align call fails: 960 vs 1192 features)

aggregator:                       # the frozen stage-1 aggregation, unchanged
  name: borda
  params: {columns: [score__pred_log10_kd, score__p_binder]}
