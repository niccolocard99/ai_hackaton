# Niccolo's pre-filter in a generate -> filter -> score loop (optimisation track, trastuzumab CDRH3 window).
#   abpipe iterate configs/niccolo_loop.yaml --rounds 3 --select 60 --out runs/loop [--propose-next]
# Round 0 starts from the priors; later rounds learn from the previous round's selected windows. See LOOP.md.
run:
  name: niccolo_loop
  out_dir: runs
  seed: 11
data_dir: ${HOME}/hackathon-team-3/apheris/hackathon-data     # git-ignored organiser data
parent:
  table: her2-trastuzumab/trastuzumab_her2_spr_all_768.csv
  window_column: cdrh3
  id: trastuzumab

generators:
  - name: scored_evolution
    n: 20000
    params:
      min_subs: 4          # >= 4 substitutions: the 70% CDRH3-identity rule binds before ">2 mutations"
      max_subs: 8
      splits_dir: ${HOME}/nick-work/splits    # the FACS clonotype splits the pre-filter trains on

filters:                   # cheap first, expensive last; each runs on the previous survivors
  - {name: framework_integrity}
  - {name: window_novelty, params: {min_dist: 3}}                 # > 2 substitutions from every provided window
  - {name: prefilter_gate, params: {min_p_binder: 0.8, splits_dir: "${HOME}/nick-work/splits"}}
  - {name: dedupe}

scorers:
  - {name: niccolo_prefilter, params: {splits_dir: "${HOME}/nick-work/splits"}}

# BASE VALIDATION, after ranking, on the top of the list only.
#
# abguard is the authoritative gate but it is also the expensive one: ~0.7 ms/design to
# number, and the novelty cross join costs 26 ms/design unpatched (37 designs/s measured,
# i.e. ~7.5 h per 1M candidates). Only the top of the ranked list can ever be submitted,
# so running it on every survivor of a large screen is work thrown away. These were
# `filters`; as `validators` they run after `rank` on `validate_top` designs.
#
# This is a reordering, not a weakening: nothing reaches selected.csv or a submission
# table without passing them (abpipe.iterate restricts selection to validate survivors,
# pinned by tests/test_validate_stage.py). Raise validate_top if validation rejects so
# many that fewer than `--select` designs survive; the log and manifest report both counts.
validators:
  - {name: abguard_hard}                                          # numbering, format, length, cysteines
  - {name: new_liabilities, params: {severities: [high], max_new: 0}}
  - {name: track_check}                                           # abguard track + each track's extra rules
validate_top: 2000

# Niccolo's cascade: gate on p_binder (the filter above), then rank on predicted log10 KD (lower is tighter).
# Naming the column is deliberate: without `columns`, every score__* column would be ranked.
# Ranking on both pre-filter scores beats ranking on pred_log10_kd alone: measured on the 179 variants with a
# known KD (out-of-fold), spearman +0.729 vs +0.680, 95% CI on the difference [+0.013, +0.094].
# Caveat: inside the >=4-substitution legal band (n=131) the gain is +0.041 with CI [-0.005, +0.092], so it is
# not established there -- but the sign is the same and it never hurt in any slice. NICCOLO/eda/p19_agg_bootstrap.py.
aggregator: {name: borda, params: {columns: [score__pred_log10_kd, score__p_binder]}}
