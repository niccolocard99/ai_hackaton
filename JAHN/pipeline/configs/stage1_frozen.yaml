# ============================================================================================================
# STAGE 1 OF THE PIPELINE -- FROZEN 2026-11-14
#
#   abpipe iterate configs/stage1_frozen.yaml --rounds 3 --select 60 --out runs/stage1
#
# Frozen means: do not edit this file to try an idea. Copy it, change the copy, and measure the change against
# the numbers below with NICCOLO/eda/p18_jahn_eval.py and p19_agg_bootstrap.py. Those scripts rank the 179
# variants with a measured KD using out-of-fold pre-filter scores, so a candidate change is judged on real
# affinity rather than on a surrogate agreeing with itself.
#
# WHAT THIS STAGE IS. Generate legal CDRH3 variants, drop the ones that fail the hard rules, and rank the
# survivors on measured-affinity surrogates. It is a pre-screen, not evidence of binding: everything it emits
# still goes to structure prediction and, for anything we submit, refolding for provenance.
#
# SCOPE. Trastuzumab's 10-residue CDRH3 window on the trastuzumab framework -- the OPTIMISATION track only.
# The pre-filter refuses any other parent (abpipe/_niccolo.check_parent). Nothing here transfers to de novo
# designs, and nothing here speaks to thermostability or epitope preservation, two of the three judged
# properties. See NICCOLO/PIPELINE.md.
#
# VALIDATED PERFORMANCE (out-of-fold, clusters held out; NICCOLO/eda/AGENT_GUIDE.md sections 1 and 3)
#   classifier  P(measurable KD)   AUROC      0.927   (0.913 inside this config's >=4-substitution band)
#   ranker      predicted log10 KD Spearman  +0.687   (+0.628 in band)
#   combined    borda of both      Spearman  +0.729   (+0.659 in band)
#   selection   select_diverse at n=20 returns a median true KD of 4.6 nM against a 116 nM band median
#
# KNOWN LIMITS, all measured
#   - The ranker INTERPOLATES. Beyond ~4 substitutions from its 179 training variants its signal vanishes
#     (Spearman +0.671 at Hamming<=2, +0.433 at <=4, -0.057 at <=5). Check a design's distance to the training
#     set before believing its pred_log10_kd.
#   - A predicted log10 KD below -1.02 (0.095 nM) is tighter than ANY measured variant in the legal band, so
#     it is extrapolation, not a promise. See LOOP.md.
#   - Only 1 of 131 measured legal variants beats trastuzumab's own KD at all, and that one is in the provided
#     data so it cannot be submitted. Binding alone is a weak basis for an S-tier claim.
#   - Selection shortens rather than pads: asking for 20 returned a median of 12 across bootstrap resamples.
#     Raise --pool-frac or the candidate count if a fixed number of submissions is needed.
# ============================================================================================================
run:
  name: stage1_frozen
  out_dir: runs
  seed: 11
data_dir: ${HOME}/hackathon-team-3/apheris/hackathon-data     # git-ignored organiser data
parent:
  table: her2-trastuzumab/trastuzumab_her2_spr_all_768.csv
  window_column: cdrh3
  id: trastuzumab

generators:
  - name: scored_evolution
    n: 20000
    params:
      min_subs: 4          # the 70% CDRH3-identity rule binds before ">2 mutations": 3 substitutions on a
      max_subs: 8          # 10-mer leave exactly 70% identity, and the rule needs strictly under 70%

filters:                   # cheap first, expensive last; each runs on the previous survivors
  - {name: framework_integrity}
  - {name: window_novelty, params: {min_dist: 3}}                 # > 2 substitutions from every provided window
  - {name: prefilter_gate, params: {min_p_binder: 0.8}}           # step 2 of the cascade; 0.8 is a budget choice
  - {name: abguard_hard}
  - {name: dedupe}
  - {name: new_liabilities, params: {severities: [high], max_new: 0}}
  - {name: track_check}                                           # BASE VALIDATION: abguard track + track rules

scorers:
  - {name: niccolo_prefilter}        # no splits_dir: the FACS feature was measured to add nothing and is off

# Rank on BOTH pre-filter scores. Measured on the 179 variants with a known KD, out-of-fold: +0.729 against
# +0.680 for pred_log10_kd alone, bootstrap difference +0.049 with 95% CI [+0.013, +0.094]. In the legal band
# the gain is +0.041, CI [-0.005, +0.092] -- not established there, but the sign holds and it never hurt.
#
# Naming `columns` is deliberate. Without it every score__* column is ranked equally, which dilutes: all five
# available columns score +0.659 against +0.729 for these two.
#
# DELIBERATELY EXCLUDED: nearest_known_binder. Its score__neighbor_binder_frac does not work (Spearman 0.100,
# p=0.18) and dilutes -- ranker plus it scores 0.508 against 0.680 for the ranker alone. Its sibling
# score__binder_distance IS a decent KD-blind signal (0.595) and is the best option for designs outside the
# ranker's range, but it adds nothing on top of the ranker, so it stays out of this stage.
aggregator: {name: borda, params: {columns: [score__pred_log10_kd, score__p_binder]}}
